version: '3.8'

# Deploy de produção (VPS, Docker Swarm) das duas APIs do ecossistema
# Koinonia — Koinonia-Api (este repo) e shepherds-toolkit-api (repo irmão,
# esperado em ../shepherds-toolkit-api). Os dois frontends (koinonia-app,
# shepherds-toolkit-app) são publicados via Vercel e não entram aqui.
# Suba as imagens localmente (`make build`), crie os secrets
# (`make secrets`) e então `make deploy`.
#
# Coloque um reverse proxy (nginx/Caddy/Traefik) na frente das portas
# publicadas abaixo para TLS + domínio — não incluído neste stack.

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - koinonia-net
    deploy:
      restart_policy:
        condition: any

  st-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${ST_DB_NAME:-shepherd_toolkit}
      POSTGRES_USER: ${ST_DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/st_db_password
    secrets:
      - st_db_password
    volumes:
      - st_db_data:/var/lib/postgresql/data
    networks:
      - koinonia-net
    deploy:
      restart_policy:
        condition: any

  koinonia-api:
    image: koinonia-api:${TAG:-latest}
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: ${KOINONIA_ALLOWED_HOSTS}
      DB_NAME: ${KOINONIA_DB_NAME}
      DB_USER: ${KOINONIA_DB_USER}
      DB_HOST: ${KOINONIA_DB_HOST}
      DB_PORT: ${KOINONIA_DB_PORT:-5432}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_URL: ${KOINONIA_FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${KOINONIA_GOOGLE_CLIENT_ID}
      GOOGLE_REDIRECT_URI: ${KOINONIA_GOOGLE_REDIRECT_URI}
      SHEPHERDS_TOOLKIT_API_URL: ${SHEPHERDS_TOOLKIT_API_URL}
      SHEPHERDS_TOOLKIT_APP_URL: ${SHEPHERDS_TOOLKIT_APP_URL}
      SHEPHERDS_TOOLKIT_CALLBACK_URL: ${KOINONIA_API_URL}/api/v1/integrations/shepherds-toolkit/callback/
      REDIS_URL: redis://redis:6379/0
    secrets:
      - source: koinonia_secret_key
        target: secret_key
      - source: koinonia_db_password
        target: db_password
      - source: koinonia_fernet_key
        target: fernet_key
      - source: koinonia_google_client_secret
        target: google_client_secret
      - source: koinonia_client_secret
        target: koinonia_client_secret
    ports:
      - "8001:8000"
    networks:
      - koinonia-net
    deploy:
      restart_policy:
        condition: any

  koinonia-celery:
    image: koinonia-api:${TAG:-latest}
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: ${KOINONIA_ALLOWED_HOSTS}
      DB_NAME: ${KOINONIA_DB_NAME}
      DB_USER: ${KOINONIA_DB_USER}
      DB_HOST: ${KOINONIA_DB_HOST}
      DB_PORT: ${KOINONIA_DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
    secrets:
      - source: koinonia_secret_key
        target: secret_key
      - source: koinonia_db_password
        target: db_password
      - source: koinonia_fernet_key
        target: fernet_key
    depends_on:
      - redis
    networks:
      - koinonia-net
    deploy:
      restart_policy:
        condition: any

  shepherds-toolkit-api:
    image: shepherds-toolkit-api:${TAG:-latest}
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: ${ST_ALLOWED_HOSTS}
      DJANGO_SETTINGS_MODULE: config.settings
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${ST_DB_NAME:-shepherd_toolkit}
      DB_USER: ${ST_DB_USER:-postgres}
      DB_HOST: st-db
      DB_PORT: 5432
      EXTRA_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_URL: ${SHEPHERDS_TOOLKIT_APP_URL}
      AUTH0_DOMAIN: ${ST_AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${ST_AUTH0_CLIENT_ID}
      AUTH0_MGMT_CLIENT_ID: ${ST_AUTH0_MGMT_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${ST_GOOGLE_CLIENT_ID}
      GOOGLE_CALENDAR_SCOPE: https://www.googleapis.com/auth/calendar.events
      STRIPE_PRICE_ID_PRO: ${ST_STRIPE_PRICE_ID_PRO}
    secrets:
      - source: st_secret_key
        target: secret_key
      - source: st_db_password
        target: db_password
      - source: st_field_encryption_key
        target: field_encryption_key
      - source: st_auth0_client_secret
        target: auth0_client_secret
      - source: st_auth0_mgmt_client_secret
        target: auth0_mgmt_client_secret
      - source: st_google_client_secret
        target: google_client_secret
      - source: st_openai_api_key
        target: openai_api_key
      - source: st_stripe_secret_key
        target: stripe_secret_key
      - source: st_stripe_webhook_secret
        target: stripe_webhook_secret
      - source: koinonia_client_secret
        target: koinonia_client_secret
    depends_on:
      - st-db
    ports:
      - "8002:8000"
    networks:
      - koinonia-net
    deploy:
      restart_policy:
        condition: any

networks:
  koinonia-net:
    driver: overlay

volumes:
  st_db_data:
  redis_data:

secrets:
  koinonia_secret_key:
    external: true
  koinonia_db_password:
    external: true
  koinonia_fernet_key:
    external: true
  koinonia_google_client_secret:
    external: true
  koinonia_client_secret:
    external: true
  st_secret_key:
    external: true
  st_db_password:
    external: true
  st_field_encryption_key:
    external: true
  st_auth0_client_secret:
    external: true
  st_auth0_mgmt_client_secret:
    external: true
  st_google_client_secret:
    external: true
  st_openai_api_key:
    external: true
  st_stripe_secret_key:
    external: true
  st_stripe_webhook_secret:
    external: true
